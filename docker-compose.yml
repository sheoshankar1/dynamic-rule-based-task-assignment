services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskassign
      POSTGRES_USER: taskassign
      POSTGRES_PASSWORD: taskassign
    # random_page_cost=1.1: the 4.0 default models a seek-bound spinning disk
    # and makes the planner prefer seq scans over index probes. See README s4.
    command: postgres -c random_page_cost=1.1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskassign"]
      interval: 3s
      retries: 10
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 10

  web:
    build: .
    environment: &env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: taskassign
      POSTGRES_USER: taskassign
      POSTGRES_PASSWORD: taskassign
      REDIS_URL: redis://redis:6379/0
      CELERY_EAGER: "0"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed --if-empty --users 200 &&
             python manage.py runserver 0.0.0.0:8000"
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/schema')\""]
      interval: 5s
      retries: 20
      start_period: 20s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    environment: *env
    # -B runs beat in the same process: the sweep and the stuck-task flag are
    # low-frequency safety nets, not throughput work, so they do not warrant a
    # separate container.
    command: celery -A config worker -B -l info
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  frontend:
    build: ./frontend
    environment:
      # Vite proxies the API rather than calling it cross-origin, so Django
      # needs no CORS package.
      BACKEND_URL: http://web:8000
    ports: ["5173:5173"]
    depends_on:
      web: {condition: service_healthy}
